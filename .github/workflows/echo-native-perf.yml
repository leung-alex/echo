name: Echo M0 evidence tooling

on:
  push:
    branches: [codex/ui]
    paths:
      - tools/echo/perf-native/**
      - tools/perf-native/**
      - .github/workflows/echo-native-perf.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: echo-m0-tools-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-tooling:
    name: Windows evidence tools (not product acceptance)
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout the requested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use the repository-pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.2'
          cache: false
      - name: Record the actual CI environment
        run: |
          $ErrorActionPreference = 'Stop'
          $logs = Join-Path $env:RUNNER_TEMP 'echo-m0-tools'
          New-Item -ItemType Directory -Path $logs -ErrorAction Stop | Out-Null
          $version = (& go env GOVERSION | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne 'go1.26.2') { throw 'Pinned Go toolchain is not available.' }
          [ordered]@{
            schema = 'echo.m0.ci-tools.v1'
            commit = $env:GITHUB_SHA
            runner_os = $env:RUNNER_OS
            os_build = [Environment]::OSVersion.Version.ToString()
            go = $version
            powershell = $PSVersionTable.PSVersion.ToString()
            g0 = 'NOT_RUN'
            product_startup = 'NOT_RUN'
            screenshots = 'NOT_RUN'
            performance = 'NOT_RUN'
            note = 'Synthetic evidence-tool tests only. A green workflow is not Echo native acceptance.'
          } | ConvertTo-Json | Set-Content (Join-Path $logs 'environment.json') -Encoding utf8
      - name: Test evidence validation on Windows
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          & go -C tools/echo test -count=1 -json ./perf-native 2>&1 |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'echo-m0-tools/go-tests.jsonl')
          if ($LASTEXITCODE -ne 0) { throw 'Evidence-tool tests failed.' }
          & go -C tools/echo vet ./perf-native 2>&1 |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'echo-m0-tools/go-vet.log')
          if ($LASTEXITCODE -ne 0) { throw 'Evidence-tool vet failed.' }
          & go -C tools/echo build -trimpath -o (Join-Path $env:RUNNER_TEMP 'perf-native.exe') ./perf-native
          if ($LASTEXITCODE -ne 0) { throw 'Windows tool build failed.' }
      - name: Test Windows collector scripts when present
        if: ${{ hashFiles('tools/perf-native/Test-Collectors.ps1') != '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tools/perf-native/Test-Collectors.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'echo-m0-tools/collector-tests')
      - name: Explicit acceptance boundary
        if: always()
        run: |
          @'
          ## M0 tool validation only
          This run does not build or start Echo, touch the clipboard, or establish a performance baseline.
          G0, real screenshots, Release startup, process-tree performance and native insertion remain NOT RUN.
          '@ >> $env:GITHUB_STEP_SUMMARY
      - name: Preserve tool logs even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: echo-m0-tools-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/echo-m0-tools/
          if-no-files-found: warn
          retention-days: 14
