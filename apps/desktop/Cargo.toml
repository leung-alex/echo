[package]
name = "echo-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = []
# Test-only owned-window input/capture bridge; never enabled in distribution builds.
native-test = ["echo-windows/native-test"]
[lib]
path = "src/lib.rs"

[dependencies]
echo-desktop-ui = { path = "ui-crate" }
echo-icon-assets = { path = "icon-crate" }
i-slint-backend-winit = { version = "=1.17.1", default-features = false, features = ["echo-software-present"] }
echo-engine.workspace = true
echo-storage.workspace = true
echo-windows.workspace = true
echo-activation.workspace = true
echo-presentation.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
sha2.workspace = true
chrono = "0.4"
raw-window-handle = "0.6"
slint = { version = "=1.17.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2", "raw-window-handle-06", "unstable-winit-030"] }

[build-dependencies]
embed-resource = "3.0.11"
[dev-dependencies]
accesskit = "=0.24.1"
tempfile = "3"
