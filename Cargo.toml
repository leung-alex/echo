[workspace]
members = [
    "crates/echo-engine",
    "crates/echo-storage",
    "crates/echo-windows",
    "crates/echo-activation",
    "crates/echo-presentation",
    "apps/desktop",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"

[workspace.dependencies]
ammonia = "4.1.4"
base64 = "0.22.1"
image = { version = "0.24.9", default-features = false, features = ["bmp", "png"] }
echo-engine = { path = "crates/echo-engine" }
echo-storage = { path = "crates/echo-storage" }
echo-windows = { path = "crates/echo-windows" }
echo-activation = { path = "crates/echo-activation" }
echo-presentation = { path = "crates/echo-presentation" }
rusqlite = { version = "=0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Keep Echo workspace crates debuggable; render/font dependencies need optimization
# for interactive DEV latency comparable to normal desktop use.
[profile.dev.package."*"]
opt-level = 3

# Generated Slint bindings run on the UI thread; leaving them unoptimized
# makes the standard echo dev build miss animation frames despite fast dependencies.
[profile.dev.package.echo-desktop]
opt-level = 1
# Keep line tables and backtraces without costly generated-variable metadata.
debug = 1

# Tests exercise behavior and pixels; optimizing generated test bindings only
# adds compile time. Runtime measurements use the separate perf profile.
[profile.test.package.echo-desktop]
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[patch.crates-io]
i-slint-backend-winit = { path = "vendor/i-slint-backend-winit" }

[profile.perf]
inherits = "release"
lto = false
incremental = true
codegen-units = 16
strip = "debuginfo"
