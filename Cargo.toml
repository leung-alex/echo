[workspace]
members = [
    "crates/echo-engine",
    "crates/echo-storage",
    "crates/echo-windows",
    "crates/echo-activation",
    "apps/desktop",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[workspace.dependencies]
ammonia = "4.1.4"
base64 = "0.22.1"
image = { version = "0.24.9", default-features = false, features = ["bmp", "png"] }
echo-engine = { path = "crates/echo-engine" }
echo-storage = { path = "crates/echo-storage" }
echo-windows = { path = "crates/echo-windows" }
echo-activation = { path = "crates/echo-activation" }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-build = "2"
tauri-plugin-single-instance = "2.4.3"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
