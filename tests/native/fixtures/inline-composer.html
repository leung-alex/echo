<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Echo Inline Composer Fixture</title>
<style>body{font:16px Segoe UI,sans-serif;margin:30px;max-width:1000px;background:#f6f6f3;color:#20232a}section{margin:18px 0;padding:20px;background:white;border:1px solid #ddd;border-radius:12px}input,textarea,[contenteditable=true]{font:18px Segoe UI,sans-serif;box-sizing:border-box;padding:14px;width:95%;border:1px solid #999;border-radius:9px;min-height:55px}textarea,[contenteditable=true]{min-height:90px}button{padding:8px 12px;margin:5px}output{margin:6px}#ai-token{background:#dbe8f9;border-radius:4px;padding:2px 5px}.facts{display:flex;gap:10px;align-items:center}textarea.report{min-height:40px;height:45px;font-size:12px}body{margin:18px}h1{font-size:20px;margin:6px 0}h2{font-size:16px;margin:4px 0}section{padding:8px;margin:8px 0}input,textarea,[contenteditable=true]{min-height:36px;padding:8px}textarea,[contenteditable=true]{min-height:50px}textarea.report{height:28px;min-height:28px;padding:3px}button{padding:4px 8px;margin:3px}[contenteditable] p{margin:0}</style>
<h1>Echo isolated input acceptance</h1><p>Local synthetic inputs only. No form can send a network request.</p>
<section><h2>Search engine input</h2>
<button id="reset-search" type="button">Reset search input</button><button id="selected-search" type="button">Select search query</button>
<input id="search" type="search" aria-label="Inline search input" autocomplete="off">
<div class="facts">Submitted: <output id="search-count" aria-label="Search submit count">0</output></div>
<textarea class="report" id="search-report" readonly aria-label="Search actual text"></textarea></section>
<section><h2>AI textarea composer</h2><button id="reset-textarea" type="button">Reset textarea composer</button>
<textarea id="textarea" aria-label="Inline textarea composer"></textarea>
<div class="facts">Sent: <output id="textarea-count" aria-label="Textarea submit count">0</output></div>
<textarea class="report" id="textarea-report" readonly aria-label="Textarea actual text"></textarea></section>
<section><h2>AI rich-text composer with a mention</h2><button id="reset-ai" type="button">Reset rich composer</button><button id="reset-empty-ai" type="button">Reset empty rich composer</button><button id="add-ai-attachment" type="button">Add synthetic attachment</button>
<div id="ai" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Inline rich AI composer"></div>
<div class="facts">Sent: <output id="ai-count" aria-label="AI submit count">0</output><output id="token-count" aria-label="Mention preserved">1</output><output id="attachment" aria-label="Attachment preserved">synthetic.pdf</output></div>
<textarea class="report" id="ai-report" readonly aria-label="AI actual text"></textarea></section>
<textarea class="report" id="state" readonly aria-label="Browser fixture state"></textarea>
<script>
const counts={search:0,textarea:0,ai:0};
function report(id){const e=document.getElementById(id);document.getElementById(id+'-report').value=id==='ai'?e.textContent:e.value;document.getElementById(id+'-count').textContent=counts[id];document.getElementById('token-count').textContent=document.getElementById('ai-token')?'1':'0';const result={};for(const key of ['search','textarea','ai']){const input=document.getElementById(key);result[key]={text:key==='ai'?input.textContent:input.value,submitted:counts[key],focused:document.activeElement===input};}result.mention=!!document.getElementById('ai-token');result.attachment=document.getElementById('attachment').textContent;document.getElementById('state').value=JSON.stringify(result);}
function reset(id,selected=false){
 const e=document.getElementById(id);counts[id]=0;
 if(id==='ai'){
  e.innerHTML='<p><span id="ai-token" contenteditable="false">@Teammate</span> pre| |post</p>';
  const node=e.lastChild.lastChild;const range=document.createRange();range.setStart(node,5);range.collapse(true);
  e.focus();getSelection().removeAllRanges();getSelection().addRange(range);
 }else{e.value=selected?'pre|echo-perf-text-0013 |post':'pre| |post';e.focus();e.setSelectionRange(4,selected?23:4);}
 report(id);
}
for(const id of ['search','textarea','ai']){
 const e=document.getElementById(id);e.addEventListener('input',()=>report(id));
 e.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.isComposing){counts[id]++;event.preventDefault();report(id);}});
 document.getElementById('reset-'+id).onclick=()=>reset(id);
}
document.getElementById('reset-empty-ai').onclick=()=>{const e=document.getElementById('ai');e.innerHTML='<p><br></p>';counts.ai=0;e.focus();const r=document.createRange();r.setStart(e.firstChild,0);r.collapse(true);getSelection().removeAllRanges();getSelection().addRange(r);report('ai');};
document.getElementById('selected-search').onclick=()=>reset('search',true);
document.getElementById('add-ai-attachment').onclick=()=>{document.getElementById('attachment').textContent='synthetic.pdf';};
document.addEventListener('selectionchange',()=>report('ai'));
reset('ai');reset('textarea');reset('search');
</script></html>
