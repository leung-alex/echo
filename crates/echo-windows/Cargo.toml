[package]
name = "echo-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
native-test = []

[lib]
path = "src/lib.rs"

[[example]]
name = "input_status_probe"
required-features = ["native-test"]

[[example]]
name = "caret_geometry_probe"
required-features = ["native-test"]

[dependencies]
echo-engine.workspace = true
windows.workspace = true
windows-core = "0.62.2"
sha2.workspace = true
image.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Media",
 "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi",
 "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem",
 "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Pipes",
 "Win32_System_IO", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_DataExchange",
 "Win32_System_Power", "Win32_System_Registry", "Win32_UI_Controls", "Win32_UI_Shell",
 "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi",
 "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Ime", "Win32_UI_Accessibility"
] }
